<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 후기 상세 :: 따뜻한 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 나만의 따뜻한 서재</h1>
            <p>책 속에서 발견한 감동을 되새겨봅니다.</p>
        </header>

        <div class="detail-header">
            <a href="index.html" class="btn-back">&larr; 목록으로</a>
            <div class="detail-buttons">
                <button class="btn-delete" onclick="alert('삭제 기능은 노션 연동 후 준비 중입니다!')">삭제하기</button>
            </div>
        </div>

        <!-- 책 상세 내용 영역 -->
        <div class="detail-content" id="detailContainer">
            <p style="text-align: center; color: #588157;">상세 내용을 불러오는 중입니다...</p>
        </div>

        <footer>
            <p>&copy; 2026 따뜻한 서재 기록장. All rights reserved.</p>
        </footer>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // 주소창(URL)에서 노션 고유 페이지 ID 가져오기 (예: ?id=숫자및영어조합)
            const urlParams = new URLSearchParams(window.location.search);
            const reviewId = urlParams.get('id');

            if (!reviewId) {
                document.getElementById('detailContainer').innerHTML = '<p style="text-align: center; color: #E07A5F;">잘못된 접근입니다. 목록에서 후기를 선택해주세요.</p>';
                return;
            }

            // Vercel 서버리스 함수로 특정 페이지 상세 데이터 요청
            fetch(`/api/review?id=${reviewId}`)
                .then(response => response.json())
                .then(review => {
                    let stars = '';
                    const scoreNum = Number(review.score) || 5;
                    for (let i = 0; i < 5; i++) {
                        stars += (i < scoreNum) ? '<span class="star-icon filled">★</span>' : '<span class="star-icon">★</span>';
                    }

                    const container = document.getElementById('detailContainer');
                    container.innerHTML = `
                        <h2 style="color: #3A5A40; margin-top: 0; font-size: 1.8rem;">${review.title}</h2>
                        <p class="card-author">작성자: ${review.author}</p>
                        <p class="card-date">작성일: ${review.date}</p>
                        
                        <div class="detail-rating" style="margin: 15px 0 25px 0;">
                            ${stars} <span style="font-weight: bold; margin-left: 5px; color: #3A5A40;">(${review.score}점)</span>
                        </div>

                        <div class="detail-section">
                            <h3>후기 내용</h3>
                            <div class="review-text" style="white-space: pre-line; line-height: 1.6; color: #34495E;">${review.content}</div>
                        </div>
                    `;
                })
                .catch(error => {
                    console.error('상세 데이터를 불러오는 중 에러 발생:', error);
                    document.getElementById('detailContainer').innerHTML = '<p style="text-align: center; color: #E07A5F;">상세 내용을 불러오지 못했습니다.</p>';
                });
        });
    </script>
</body>
</html>
