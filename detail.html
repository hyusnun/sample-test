<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 후기 상세 :: 따뜻한 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 나만의 따뜻한 서재</h1>
            <p>책 속에서 발견한 감동을 되새겨봅니다.</p>
        </header>

        <div class="detail-header">
            <a href="index.html" class="btn-back">&larr; 목록으로</a>
            <div class="detail-buttons">
                <button class="btn-edit" onclick="location.href='edit.html'">수정하기</button>
                <button class="btn-delete" onclick="alert('삭제 기능은 준비 중입니다!')">삭제하기</button>
            </div>
        </div>

        <div class="detail-content" id="detailContainer">
            <p style="text-align: center; color: #588157;">상세 내용을 불러오는 중입니다...</p>
        </div>

        <footer>
            <p>&copy; 2026 따뜻한 서재 기록장. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwDzjC4Yfaz0jN6fSKEQe05zggbDL-pkO_Hzp4XupI9NH3UToArEFrCZrxlpQyaFcw/exec";

        window.addEventListener('DOMContentLoaded', function() {
            // 주소창(URL)에서 넘어온 index 번호표 읽기 (예: ?index=0)
            const urlParams = new URLSearchParams(window.location.search);
            const reviewIndex = urlParams.get('index');

            if (reviewIndex === null) {
                document.getElementById('detailContainer').innerHTML = '<p style="text-align: center; color: #E07A5F;">잘못된 접근입니다. 목록에서 후기를 선택해주세요.</p>';
                return;
            }

            // 구글 스프레드시트에서 전체 데이터 가져오기
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    const review = data[reviewIndex]; // 해당 번호의 후기 데이터 콕 집어내기

                    if (!review) {
                        document.getElementById('detailContainer').innerHTML = '<p style="text-align: center; color: #E07A5F;">해당 후기를 찾을 수 없습니다.</p>';
                        return;
                    }

                    // 별점 만들기
                    let stars = '';
                    const ratingNum = Number(review.rating) || 0;
                    for (let i = 0; i < 5; i++) {
                        stars += (i < ratingNum) ? '<span class="star-icon filled">★</span>' : '<span class="star-icon">★</span>';
                    }

                    // 상세 화면 HTML 그리기
                    const container = document.getElementById('detailContainer');
                    container.innerHTML = `
                        <h2 style="color: #3A5A40; margin-top: 0; font-size: 1.8rem;">${review.title}</h2>
                        <p class="card-author">작성자: ${review.author}</p>
                        <p class="card-date">작성일: ${review.date}</p>
                        
                        <div class="detail-rating" style="margin: 15px 0 25px 0;">
                            ${stars} <span style="font-weight: bold; margin-left: 5px; color: #3A5A40;">(${review.rating}점 만점)</span>
                        </div>

                        <div class="detail-section">
                            <h3>후기 내용</h3>
                            <div class="review-text" style="white-space: pre-line; line-height: 1.6; color: #34495E;">${review.content}</div>
                        </div>
                    `;
                })
                .catch(error => {
                    console.error('상세 데이터를 불러오는 중 에러 발생:', error);
                    document.getElementById('detailContainer').innerHTML = '<p style="text-align: center; color: #E07A5F;">데이터를 불러오지 못했습니다.</p>';
                });
        });
    </script>
</body>
</html>
