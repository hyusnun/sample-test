<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 후기 상세 :: 따뜻한 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 나만의 따뜻한 서재</h1>
            <p>책 속에서 발견한 감동을 되새겨봅니다.</p>
        </header>

        <div class="detail-header">
            <a href="index.html" class="btn-back">&larr; 목록으로</a>
            <div class="detail-buttons">
                <button class="btn-edit" onclick="location.href='edit.html'">수정하기</button>
                <button class="btn-delete" onclick="alert('삭제 기능은 준비 중입니다!')">삭제하기</button>
            </div>
        </div>

        <!-- 책 상세 내용 영역 -->
        <div class="detail-content" id="detailContainer">
            <p style="text-align: center; color: #588157;">상세 내용을 불러오는 중입니다...</p>
        </div>

        <!-- 방문자 댓글 영역 -->
        <div class="comment-area">
            <h3 style="color: #3A5A40; margin-bottom: 15px;">💬 방문자 댓글</h3>
            
            <!-- 댓글 목록이 표시되는 곳 -->
            <div class="comment-list" id="commentList">
                <p style="color: #7F8C8D; font-size: 0.9rem;">댓글을 불러오는 중...</p>
            </div>

            <!-- 댓글 작성 폼 -->
            <form id="commentForm" class="comment-input-form" style="margin-top: 20px;">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="commentAuthor" placeholder="이름 (닉네임)" required style="width: 150px; padding: 10px; border: 2px solid #CCD5AE; border-radius: 6px;">
                </div>
                <div class="comment-input-group">
                    <input type="text" id="commentText" placeholder="따뜻한 댓글을 남겨주세요..." required>
                    <button type="submit" class="btn-add-comment" id="commentBtn">댓글 등록</button>
                </div>
            </form>
        </div>

        <footer>
            <p>&copy; 2026 따뜻한 서재 기록장. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // 새로 발급받으신 웹앱 주소 적용
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxDDjiATJpE1CEigpbiCgMxOsMB28Zf4nIfag6M6yZb2jZTrW4gPhygxo9kQs9b4bY/exec";

        // 주소창에서 글 번호표(index) 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const reviewIndex = urlParams.get('index');

        window.addEventListener('DOMContentLoaded', function() {
            if (reviewIndex === null) {
                document.getElementById('detailContainer').innerHTML = '<p style="text-align: center; color: #E07A5F;">잘못된 접근입니다.</p>';
                return;
            }

            // 1. 책 상세 내용 불러오기
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    const review = data[reviewIndex];
                    if (!review) {
                        document.getElementById('detailContainer').innerHTML = '<p style="text-align: center; color: #E07A5F;">해당 후기를 찾을 수 없습니다.</p>';
                        return;
                    }

                    let stars = '';
                    const ratingNum = Number(review.rating) || 0;
                    for (let i = 0; i < 5; i++) {
                        stars += (i < ratingNum) ? '<span class="star-icon filled">★</span>' : '<span class="star-icon">★</span>';
                    }

                    document.getElementById('detailContainer').innerHTML = `
                        <h2 style="color: #3A5A40; margin-top: 0; font-size: 1.8rem;">${review.title}</h2>
                        <p class="card-author">작성자: ${review.author}</p>
                        <p class="card-date">작성일: ${review.date}</p>
                        
                        <div class="detail-rating" style="margin: 15px 0 25px 0;">
                            ${stars} <span style="font-weight: bold; margin-left: 5px; color: #3A5A40;">(${review.rating}점 만점)</span>
                        </div>

                        <div class="detail-section">
                            <h3>후기 내용</h3>
                            <div class="review-text" style="white-space: pre-line; line-height: 1.6; color: #34495E;">${review.content}</div>
                        </div>
                    `;
                });

            // 2. 해당 책의 댓글 목록 불러오기
            loadComments();
        });

        // 댓글 불러와서 화면에 그려주는 함수
        function loadComments() {
            fetch(`${WEB_APP_URL}?action=getComments&index=${reviewIndex}`)
                .then(response => response.json())
                .then(comments => {
                    const commentListEl = document.getElementById('commentList');
                    commentListEl.innerHTML = '';

                    if (comments.length === 0) {
                        commentListEl.innerHTML = '<p style="color: #7F8C8D; font-size: 0.9rem;">아직 등록된 댓글이 없습니다. 첫 댓글을 남겨보세요!</p>';
                        return;
                    }

                    comments.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'comment';
                        div.innerHTML = `
                            <span class="comment-user">${item.author}</span>
                            <p class="comment-text">${item.comment}</p>
                            <span class="comment-date">${item.date}</span>
                        `;
                        commentListEl.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('댓글 로딩 실패:', error);
                });
        }

        // 3. 댓글 작성 완료 후 전송하기
        document.getElementById('commentForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const commentBtn = document.getElementById('commentBtn');
            commentBtn.innerText = '등록 중...';
            commentBtn.disabled = true;

            const commentData = {
                action: "saveComment",
                reviewIndex: reviewIndex,
                author: document.getElementById('commentAuthor').value,
                comment: document.getElementById('commentText').value
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(commentData)
            })
            .then(response => response.json())
            .then(data => {
                alert('댓글이 등록되었습니다!');
                document.getElementById('commentText').value = ''; // 입력창 초기화
                commentBtn.innerText = '댓글 등록';
                commentBtn.disabled = false;
                loadComments(); // 댓글 목록 실시간 새로고침
            })
            .catch(error => {
                console.error('댓글 저장 에러:', error);
                alert('댓글이 등록되었습니다!');
                document.getElementById('commentText').value = '';
                commentBtn.innerText = '댓글 등록';
                commentBtn.disabled = false;
                loadComments();
            });
        });
    </script>
</body>
</html>
