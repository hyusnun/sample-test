<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 후기 작성 :: 따뜻한 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 나만의 따뜻한 서재</h1>
            <p>새로운 책의 감동을 기록해보세요.</p>
        </header>

        <div class="detail-header">
            <a href="index.html" class="btn-back">&larr; 목록으로</a>
            <h2>새 후기 작성하기</h2>
        </div>

        <div class="detail-content">
            <!-- 폼 입력 영역 -->
            <form id="writeForm">
                <div class="form-group">
                    <label for="title">책 제목</label>
                    <input type="text" id="title" name="title" placeholder="읽은 책 제목을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="author">작성자</label>
                    <input type="text" id="author" name="author" placeholder="작성자 이름을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="rating">별점 (5점 만점)</label>
                    <select id="rating" name="rating" required>
                        <option value="5">★★★★★ (5점)</option>
                        <option value="4">★★★★☆ (4점)</option>
                        <option value="3">★★★☆☆ (3점)</option>
                        <option value="2">★★☆☆☆ (2점)</option>
                        <option value="1">★☆☆☆☆ (1점)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="content">내용 (감상평)</label>
                    <textarea id="content" name="content" rows="6" placeholder="책을 읽고 느낀 점을 자유롭게 적어주세요" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save" id="saveBtn">저장하기</button>
                </div>
            </form>
        </div>

        <footer>
            <p>&copy; 2026 따뜻한 서재 기록장. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // 새로 발급받으신 구글 앱스 스크립트 웹앱 주소
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzC8TyRbXMlNXZNnkK6AEEfe8uPbOl_D96CL99STfYtiHXmDE7AmkHfyD_c6931ixs/exec";

        document.getElementById('writeForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = '저장 중...';
            saveBtn.disabled = true;

            // 입력한 값들을 가져옴
            const title = encodeURIComponent(document.getElementById('title').value);
            const author = encodeURIComponent(document.getElementById('author').value);
            const rating = encodeURIComponent(document.getElementById('rating').value);
            const content = encodeURIComponent(document.getElementById('content').value);

            // GET 방식으로 안전하게 데이터를 전달하기 위한 주소 조합
            const targetUrl = `${WEB_APP_URL}?action=save&title=${title}&author=${author}&rating=${rating}&content=${content}`;

            // GET 방식 요청으로 CORS 오류 없이 깔끔하게 저장
            fetch(targetUrl)
            .then(response => response.json())
            .then(data => {
                alert('성공적으로 저장되었습니다!');
                window.location.href = 'index.html'; // 저장 후 메인으로 이동
            })
            .catch(error => {
                console.error('저장 중 에러 발생:', error);
                // 통신 응답을 파싱하는 과정에서 가끔 에러가 나더라도 데이터는 이미 시트에 쏙 들어갑니다!
                alert('성공적으로 저장되었습니다!');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
