<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 후기 작성 :: 따뜻한 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 나만의 따뜻한 서재</h1>
            <p>새로운 책의 감동을 기록해보세요.</p>
        </header>

        <div class="detail-header">
            <a href="index.html" class="btn-back">&larr; 목록으로</a>
            <h2>새 후기 작성하기</h2>
        </div>

        <div class="detail-content">
            <!-- 폼 입력 영역 -->
            <form id="writeForm">
                <div class="form-group">
                    <label for="title">책 제목</label>
                    <input type="text" id="title" name="title" placeholder="읽은 책 제목을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="author">작성자</label>
                    <input type="text" id="author" name="author" placeholder="작성자 이름을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="rating">별점 (5점 만점)</label>
                    <select id="rating" name="rating" required>
                        <option value="5">★★★★★ (5점)</option>
                        <option value="4">★★★★☆ (4점)</option>
                        <option value="3">★★★☆☆ (3점)</option>
                        <option value="2">★★☆☆☆ (2점)</option>
                        <option value="1">★☆☆☆☆ (1점)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="content">내용 (감상평)</label>
                    <textarea id="content" name="content" rows="6" placeholder="책을 읽고 느낀 점을 자유롭게 적어주세요" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save" id="saveBtn">저장하기</button>
                </div>
            </form>
        </div>

        <footer>
            <p>&copy; 2026 따뜻한 서재 기록장. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwGguvOZqgbJm09TPtCbWwvyLItvOMZvpLeDxuza-JKE6hVFeQ00ykVMXnkB6kP5sI/exec";

        document.getElementById('writeForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = '저장 중...';
            saveBtn.disabled = true;

            const formData = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                rating: document.getElementById('rating').value,
                content: document.getElementById('content').value
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // GitHub Pages 환경에서 CORS 차단을 우회하기 위한 설정
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                // no-cors 모드에서는 응답 내용을 직접 읽을 수 없으므로 성공으로 처리하고 메인으로 이동
                alert('성공적으로 저장되었습니다!');
                window.location.href = 'index.html';
            })
            .catch(error => {
                console.error('저장 중 에러 발생:', error);
                alert('저장에 실패했습니다. 다시 시도해주세요.');
                saveBtn.innerText = '저장하기';
                saveBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
