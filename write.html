<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 후기 작성 :: 따뜻한 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 나만의 따뜻한 서재</h1>
            <p>새로운 책의 감동을 기록해보세요.</p>
        </header>

        <div class="detail-header">
            <a href="index.html" class="btn-back">&larr; 목록으로</a>
            <h2>새 후기 작성하기</h2>
        </div>

        <div class="detail-content">
            <!-- CORS 오류를 완벽히 우회하기 위해 숨겨진 iframe을 타겟으로 지정한 폼 -->
            <form id="writeForm" action="https://script.google.com/macros/s/AKfycbwGguvOZqgbJm09TPtCbWwvyLItvOMZvpLeDxuza-JKE6hVFeQ00ykVMXnkB6kP5sI/exec" method="POST" target="hidden_iframe">
                
                <div class="form-group">
                    <label for="title">책 제목</label>
                    <input type="text" id="title" name="title" placeholder="읽은 책 제목을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="author">작성자</label>
                    <input type="text" id="author" name="author" placeholder="작성자 이름을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="rating">별점 (5점 만점)</label>
                    <select id="rating" name="rating" required>
                        <option value="5">★★★★★ (5점)</option>
                        <option value="4">★★★★☆ (4점)</option>
                        <option value="3">★★★☆☆ (3점)</option>
                        <option value="2">★★☆☆☆ (2점)</option>
                        <option value="1">★☆☆☆☆ (1점)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="content">내용 (감상평)</label>
                    <textarea id="content" name="content" rows="6" placeholder="책을 읽고 느낀 점을 자유롭게 적어주세요" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save" id="saveBtn">저장하기</button>
                </div>
            </form>

            <!-- 화면에 보이지 않게 데이터를 전송하기 위한 숨김 아이프레임 -->
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="submitted=true;"></iframe>
        </div>

        <footer>
            <p>&copy; 2026 따뜻한 서재 기록장. All rights reserved.</p>
        </footer>
    </div>

    <script>
        let submitted = false;

        document.getElementById('writeForm').addEventListener('submit', function() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = '저장 중...';
            saveBtn.disabled = true;

            // 저장 요청 후 1.5초 뒤에 메인 페이지로 부드럽게 이동
            setTimeout(function() {
                alert('성공적으로 저장되었습니다!');
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
