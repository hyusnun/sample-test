<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>따뜻한 나의 책장 - 새 후기 작성</title>
    <link rel="stylesheet" href="style.css">a
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container detail-container">
        <!-- 상단 네비게이션 -->
        <nav class="nav-back">
            <a href="index.html" class="btn back-btn">&larr; 홈으로 돌아가기</a>
        </nav>

        <!-- 작성 폼 카드 -->
        <article class="detail-card">
            <h1 class="book-title-large" style="margin-bottom: 25px;">✍️ 새 책 후기 작성하기</h1>
            
            <form class="write-form">
                <div class="form-group">
                    <label>책 제목</label>
                    <input type="text" placeholder="책 제목을 입력해주세요" class="form-input" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>작성자</label>
                        <input type="text" placeholder="이름을 입력해주세요" class="form-input" />
                    </div>
                    <div class="form-group">
                        <label>작성일</label>
                        <input type="date" class="form-input" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>책 표지 이미지 선택</label>
                        <input type="file" class="form-file" />
                    </div>
                    <div class="form-group">
                        <label>별점 (5점 만점)</label>
                        <select class="form-input">
                            <option value="5">⭐⭐⭐⭐⭐ (5점)</option>
                            <option value="4">⭐⭐⭐⭐ (4점)</option>
                            <option value="3">⭐⭐⭐ (3점)</option>
                            <option value="2">⭐⭐ (2점)</option>
                            <option value="1">⭐ (1점)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>후기 내용</label>
                    <textarea placeholder="책을 읽고 느낀 점을 자유롭게 적어주세요..." class="form-textarea" style="min-height: 150px;"></textarea>
                </div>

                <div class="form-group">
                    <label>💡 좋았던 구절</label>
                    <div class="quote-input-row">
                        <input type="text" placeholder="페이지 번호 (예: p. 45)" class="form-input" style="width: 120px;" />
                        <input type="text" placeholder="마음에 들었던 구절 내용" class="form-input" style="flex: 1;" />
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 30px; text-align: right;">
                    <a href="index.html" class="btn back-btn">취소</a>
                    <button type="submit" class="btn primary-btn">저장하기</button>
                </div>
            </form>
        </article>

        <!-- 푸터 -->
        <footer class="footer">
            <p>&copy; 2026 따뜻한 나의 책장. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
