<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 책 기록장 :: 따뜻한 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 나만의 따뜻한 서재</h1>
            <p>읽은 책들의 감동을 기록하는 공간입니다.</p>
        </header>

        <div class="search-area">
            <input type="text" id="searchInput" placeholder="책 제목 또는 작성자 검색...">
            <button class="btn-search" onclick="searchReviews()">검색</button>
            <a href="write.html" class="btn-write">새 글 쓰기</a>
        </div>

        <div class="review-list" id="reviewList">
            <p style="text-align: center; color: #588157;">노션에서 데이터를 불러오는 중입니다...</p>
        </div>

        <footer>
            <p>&copy; 2026 따뜻한 서재 기록장. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const API_URL = '/api/reviews';
        let allReviews = []; 

        window.addEventListener('DOMContentLoaded', function() {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    allReviews = data;
                    displayReviews(allReviews);
                })
                .catch(error => {
                    console.error('데이터를 불러오는 중 에러 발생:', error);
                    document.getElementById('reviewList').innerHTML = '<p style="text-align: center; color: #E07A5F;">데이터를 불러오지 못했습니다.</p>';
                });
        });

        function displayReviews(reviews) {
            const reviewListEl = document.getElementById('reviewList');
            reviewListEl.innerHTML = '';

            if (reviews.length === 0) {
                reviewListEl.innerHTML = '<p style="text-align: center; color: #7F8C8D;">등록된 책 후기가 없습니다. 첫 글을 작성해 보세요!</p>';
                return;
            }

            reviews.forEach((review) => {
                // 별점(score) 숫자를 받아 별 모양 문자열로 변환 (예: 5점이면 ★★★★★)
                let stars = '';
                const scoreNum = Number(review.score) || 5;
                for (let i = 0; i < 5; i++) {
                    stars += (i < scoreNum) ? '<span class="star-icon filled">★</span>' : '<span class="star-icon">★</span>';
                }

                const card = document.createElement('div');
                card.className = 'review-card';
                // 노션 고유 페이지 ID(review.id)를 상세 페이지로 전달
                card.innerHTML = `
                    <div class="card-content" style="width: 100%;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <h3 style="margin: 0; color: #3A5A40;">${review.title}</h3>
                            <div>${stars}</div>
                        </div>
                        <p class="card-author">작성자: ${review.author}</p>
                        <p class="card-date">작성일: ${review.date}</p>
                        <p class="card-preview">${review.content}</p>
                        <div class="card-actions">
                            <a href="detail.html?id=${review.id}" class="btn-detail">자세히 보기</a>
                        </div>
                    </div>
                `;
                reviewListEl.appendChild(card);
            });
        }

        function searchReviews() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allReviews.filter(review => {
                const titleMatch = review.title && review.title.toLowerCase().includes(keyword);
                const authorMatch = review.author && review.author.toLowerCase().includes(keyword);
                return titleMatch || authorMatch;
            });
            displayReviews(filtered);
        }
    </script>
</body>
</html>
