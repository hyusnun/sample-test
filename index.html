<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 책 기록장 :: 따뜻한 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 나만의 따뜻한 서재</h1>
            <p>읽은 책들의 감동을 기록하는 공간입니다.</p>
        </header>

        <div class="search-area">
            <input type="text" id="searchInput" placeholder="책 제목 또는 작성자 검색...">
            <button class="btn-search" onclick="searchReviews()">검색</button>
            <a href="write.html" class="btn-write">새 글 쓰기</a>
        </div>

        <div class="review-list" id="reviewList">
            <p style="text-align: center; color: #588157;">데이터를 불러오는 중입니다...</p>
        </div>

        <footer>
            <p>&copy; 2026 따뜻한 서재 기록장. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxDDjiATJpE1CEigpbiCgMxOsMB28Zf4nIfag6M6yZb2jZTrW4gPhygxo9kQs9b4bY/exec";

        let allReviews = []; 
        let allCommentsMap = {}; // 각 책 인덱스별 댓글 개수를 담아둘 통계 상자

        window.addEventListener('DOMContentLoaded', function() {
            // 1. 책 후기 목록과 전체 댓글 목록을 동시에 불러오기
            Promise.all([
                fetch(WEB_APP_URL).then(res => res.json()),
                fetch(`${WEB_APP_URL}?action=getAllComments`).then(res => res.json()).catch(() => [])
            ])
            .then(([reviews, comments]) => {
                allReviews = reviews;

                // 댓글 데이터를 책 번호(reviewIndex)별로 개수 세기
                allCommentsMap = {};
                comments.forEach(c => {
                    const idx = String(c.reviewIndex);
                    allCommentsMap[idx] = (allCommentsMap[idx] || 0) + 1;
                });

                displayReviews(allReviews);
            })
            .catch(error => {
                console.error('데이터를 불러오는 중 에러 발생:', error);
                document.getElementById('reviewList').innerHTML = '<p style="text-align: center; color: #E07A5F;">데이터를 불러오지 못했습니다. 주소를 확인해주세요.</p>';
            });
        });

        function displayReviews(reviews) {
            const reviewListEl = document.getElementById('reviewList');
            reviewListEl.innerHTML = '';

            if (reviews.length === 0) {
                reviewListEl.innerHTML = '<p style="text-align: center; color: #7F8C8D;">등록된 책 후기가 없습니다. 첫 글을 작성해 보세요!</p>';
                return;
            }

            reviews.forEach((review, index) => {
                let stars = '';
                const ratingNum = Number(review.rating) || 0;
                for (let i = 0; i < 5; i++) {
                    stars += (i < ratingNum) ? '<span class="star-icon filled">★</span>' : '<span class="star-icon">★</span>';
                }

                let formattedDate = review.date ? review.date.toString().split('T')[0] : '';
                
                // 해당 책에 달린 댓글 개수 가져오기 (없으면 0개)
                const commentCount = allCommentsMap[index] || 0;
                // 댓글이 1개 이상일 때만 표시할 뱃지 HTML 생성
                const commentBadge = commentCount > 0 
                    ? `<span style="background-color: #F4F7F2; color: #3A5A40; border: 1px solid #A3B18A; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-left: 10px;">💬 댓글 ${commentCount}</span>` 
                    : '';

                const card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    <div class="card-content" style="width: 100%;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <h3 style="margin: 0; color: #3A5A40;">${review.title} ${commentBadge}</h3>
                            <div>${stars}</div>
                        </div>
                        <p class="card-author">작성자: ${review.author}</p>
                        <p class="card-date">작성일: ${formattedDate}</p>
                        <p class="card-preview">${review.content}</p>
                        <div class="card-actions">
                            <a href="detail.html?index=${index}" class="btn-detail">자세히 보기</a>
                        </div>
                    </div>
                `;
                reviewListEl.appendChild(card);
            });
        }

        function searchReviews() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allReviews.filter(review => {
                const titleMatch = review.title && review.title.toLowerCase().includes(keyword);
                const authorMatch = review.author && review.author.toLowerCase().includes(keyword);
                return titleMatch || authorMatch;
            });
            displayReviews(filtered);
        }
    </script>
</body>
</html>
